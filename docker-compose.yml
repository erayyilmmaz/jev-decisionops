services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: decisionops
      POSTGRES_USER: decisionops
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-decisionops_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decisionops -d decisionops"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
