name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pytest tests/unit --cov=decisionops --cov-report=term-missing --cov-report=xml
      - run: uv lock --check
      - run: uv build

  postgres-integration:
    name: PostgreSQL migration and integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: decisionops
          POSTGRES_USER: decisionops
          POSTGRES_PASSWORD: decisionops_ci_only
        options: >-
          --health-cmd "pg_isready -U decisionops -d decisionops"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 5432:5432
    env:
      ALEMBIC_DATABASE_URL: postgresql+psycopg://decisionops:decisionops_ci_only@localhost:5432/decisionops
      DECISIONOPS_INTEGRATION_DATABASE_URL: postgresql+asyncpg://decisionops:decisionops_ci_only@localhost:5432/decisionops
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run alembic -c alembic.ini upgrade head
      - run: uv run pytest tests/integration

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag jev-decisionops:ci .

  security:
    name: Static security boundary checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv lock --check
      - run: uv run python scripts/check_security.py

  demo:
    name: Synthetic V0 demo smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python scripts/run_synthetic_demo.py --repeat 125 --output demo-artifacts
      - run: test -s demo-artifacts/baseline-replay.json
      - run: test -s demo-artifacts/candidate-replay.json
      - run: test -s demo-artifacts/comparison.json
