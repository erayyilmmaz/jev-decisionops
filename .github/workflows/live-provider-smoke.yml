name: Live provider smoke

on:
  workflow_dispatch:
    inputs:
      confirm_live_provider_call:
        description: Confirm that this manually dispatched workflow may call the configured TypeSafe account.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  smoke:
    if: ${{ inputs.confirm_live_provider_call }}
    runs-on: ubuntu-latest
    env:
      LIVE_PROVIDER_CALLS_ENABLED: "true"
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - run: uv sync --locked --all-groups
      - run: uv run python scripts/live_provider_smoke.py
